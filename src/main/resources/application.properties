spring.application.name=YAMIS

#TOMCAT CONFIGURATION
server.port=8120

#DATASOURCE CONFIGURATION (Vendor can be MYSQL or POSTGRESQL)
db.vendor=${database-vendor:POSTGRESQL}
db.driver-class-name=${database-driver-class-name:org.postgresql.Driver}
db.connection-host=${database-host:localhost}
db.connection-port=${database-port:5433}
db.connection-catalog=${database-calatog:yamis_db}
db.username=${database-username:yamis}
db.password=${database-password:realtiger}

#LIQUIBASE CONFIGURATION
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# SPRING DATA WEB CONFIGURATION
spring.data.web.pageable.page-serialization-mode=via-dto
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=10

# SWAGGER / OPENAPI CONFIGURATION
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.display-request-duration=true
